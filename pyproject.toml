[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-ins"
version = "0.1.0"
description = "Molecular dynamics to inelastic neutron scattering: trajectory-to-pDOS pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "euphonic",
    "phonopy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md_ins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (e.g. full MD benchmark runs)",
]
filterwarnings = [
    # ASE/numpy 2.5 emits this from its own array reshaping; not actionable here.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # ASE ZeroRotation notes periodic boundaries are ignored for the
    # inertial tensor; benign for a periodic solid benchmark.
    "ignore:Periodic boundary conditions are ignored when calculating the inertial tensor:UserWarning",
    # ASE deprecates MaxwellBoltzmannDistribution in favour of thermalize_momenta;
    # still functional for the benchmark fixture.
    "ignore::DeprecationWarning:ase",
    # Phonopy emits a primitive-matrix default notice on FCC cells.
    "ignore:primitive_matrix:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
