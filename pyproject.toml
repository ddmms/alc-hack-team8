[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdins"
version = "0.1.0.dev0"
description = "Inelastic neutron scattering spectra from molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alin Marin Elena" }]
keywords = ["neutron", "scattering", "molecular-dynamics", "phonons", "INS"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "ase>=3.23",
  "h5py>=3.10",
]

[project.optional-dependencies]
euphonic = ["euphonic>=1.3"]
# AbINS is not distributed on PyPI; it ships inside Mantid and is conda-only. The
# optional cross-check against it (design.md D4) therefore needs a conda environment and
# cannot be expressed as an extra here.

[project.scripts]
mdins = "mdins.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.14",
]
# Only needed to regenerate the figures in docs/validation.md, which are committed.
docs = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mdins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end tests that run molecular dynamics (deselect with '-m \"not slow\"')",
  "reference: comparisons against external codes; not run in CI",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "NPY", "RUF"]
# The prose and docstrings here deliberately use en dashes and characters such as
# Å, ², ⁻ and ω. Flagging them as "ambiguous" is noise in a scientific codebase.
ignore = ["RUF002", "RUF003"]

[tool.mypy]
# No python_version pin: the numpy stubs use `type` statements, so mypy must be run
# under the interpreter it is checking for. CI covers 3.11-3.13.
packages = ["mdins"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["h5py.*", "ase.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mdins.units", "mdins.ir", "mdins.spectral", "mdins.provenance"]
disallow_untyped_defs = true
strict_equality = true

[tool.ruff.lint.per-file-ignores]
# `value == pytest.approx(...)` is the idiomatic order, not a Yoda condition.
"tests/**" = ["SIM300"]
